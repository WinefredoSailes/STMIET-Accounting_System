{% extends "ui/base.html" %}
{% block title %}{% if editing %}Edit{% else %}Create{% endif %} COA Account — STMIET Accounting{% endblock %}
{% block content %}
<div class="p-6 sm:p-8 max-w-2xl">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-semibold text-slate-900{% if editing %} text-slate-600{% endif %}">
      {% if editing %}Edit{% else %}Create{% endif %} COA Account
    </h2>
  </div>

  <form method="post" class="space-y-4"
    data-hx-post-create="{% url 'ui:coa_create' %}"
    data-hx-post-update="{% url 'ui:coa_update' account.pk %}"
    hx-target="closest div.p-6" swap="outer">
    {% csrf_token %}
    {% if editing %}
      <input type="hidden" name="pk" value="{{ account.pk }}">
    {% endif %}

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Code</label>
        <input type="text" name="code" value="{{ account.code }}" required
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none"
          placeholder="Auto-generated" readonly>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Name</label>
        <input type="text" name="name" value="{{ account.name }}" required
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none"
          placeholder="Account name">
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Account Type</label>
        <select name="account_type" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
          {% for value, label in types %}
            <option value="{{ value }}" {% if account.account_type == value %}selected{% endif %}>
              {{ label }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">Normal Balance</label>
        <select name="normal_balance" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
          <option value="debit" {% if account.normal_balance == "debit" %}selected{% endif %}>Debit</option>
          <option value="credit" {% if account.normal_balance == "credit" %}selected{% endif %}>Credit</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-600 mb-1">Segment</label>
      <select name="segment" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
        <option value="">—</option>
        {% for seg in segments %}
          <option value="{{ seg.code }}" {% if account.segment and account.segment.code == seg.code %}selected{% endif %}>
            {{ seg.code }} - {{ seg.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <script>
      // Set the HTMX hx-post URL based on create vs edit mode
      const form = document.querySelector('form');
      if (form.dataset.hxPostUpdate) {
        form.setAttribute('hx-post', form.dataset.editing ? form.dataset.hxPostUpdate : form.dataset.hxPostCreate);
      }
    </script>

    <div class="flex justify-end mt-6 gap-3">
      <button type="submit"
        class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">
        {% if editing %}Update{% else %}Save{% endif %}
      </button>
      <a href="{% url 'ui:coa_list' %}"
        class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300/40">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
