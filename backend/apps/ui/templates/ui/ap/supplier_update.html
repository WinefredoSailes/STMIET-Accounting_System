{% extends "ui/base.html" %}
{% load ui_filters %}
{% block title %}Edit Supplier — STMIET Accounting{% endblock %}
{% block content %}
<div class="p-6">
  <h1 class="text-xl font-semibold text-slate-900 mb-4">Edit Supplier</h1>

  <form method="post" class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
    {% csrf_token %}
    <input type="hidden" name="supplier_id" value="{{ supplier.pk }}">

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Code</label>
        <input type="text" name="code" value="{{ supplier.code }}" class="rounded-md border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Business Name</label>
        <input type="text" name="name" value="{{ supplier.name }}" class="rounded-md border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Supplier Type</label>
        <select name="supplier_type" class="rounded-md border border-slate-300 px-3 py-1.5 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
          {% for code, label in supplier_types %}
          <option value="{{ code }}" {% if supplier.supplier_type == code %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Default Segment</label>
        <select name="default_segment" class="rounded-md border border-slate-300 px-3 py-1.5 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
          {% for seg in Segment.objects.order_by("code") %}
          <option value="{{ seg.code }}" {% if supplier.default_segment == seg.code %}selected{% endif %}>{{ seg.code }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Owner/Rep</label>
        <input type="text" name="owner_name" value="{{ supplier.owner_name|default:"-" }}" class="rounded-md border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">TIN</label>
        <input type="text" name="tin" value="{{ supplier.tin|default:"-" }}" class="rounded-md border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="text" name="email" value="{{ supplier.email|default:"-" }}" class="rounded-md border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contact No</label>
        <input type="text" name="contact_no" value="{{ supplier.contact_no|default:"-" }}" class="rounded-md border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-1">Attachments Required</label>
      <div class="flex items-center">
        <input type="checkbox" name="attachments_required" {% "checked" if supplier.attachments_required else "" %} class="rounded-md bg-white border border-slate-300 py-1.5 px-3 focus:ring-2 focus:ring-indigo-500/40 cursor-pointer">
        <span class="ml-2 text-slate-700">Required</span>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-3">
      <a href="{% url 'ui:supplier_list' %}" class="rounded-md bg-slate-200 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</a>
      <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Save changes</button>
    </div>
  </form>
</div>
{% endblock %}
