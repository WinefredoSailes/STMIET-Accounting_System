{% extends "ui/base.html" %}
{% block title %}New CONSO Batch — STMIET Accounting{% endblock %}
{% block content %}
<div class="p-6">
  <a href="{% url 'ui:conso_list' %}" class="text-sm text-slate-500 hover:text-slate-700">&larr; CONSO batches</a>
  <h1 class="text-xl font-semibold text-slate-900 mt-1">New CONSO Batch</h1>
  <p class="text-sm text-slate-500 mt-1">Opens a batch; add approved RFPs from the detail screen, then post atomically.</p>

  <form method="post" class="mt-6 bg-white rounded-xl border border-slate-200 p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="id_conso_date">Batch date</label>
      <input type="date" name="conso_date" id="id_conso_date" required value="{{ today|date:'Y-m-d' }}"
             class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
    </div>
    <div class="flex justify-end">
      <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
        Open batch (auto CONSO-YYYY-##)
      </button>
    </div>
  </form>
</div>
{% endblock %}
