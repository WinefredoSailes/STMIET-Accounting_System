{% extends "ui/base.html" %}
{% block title %}New Petty Cash Fund — STMIET Accounting{% endblock %}
{% block content %}
<div class="p-6">
  <a href="{% url 'ui:pcf_list' %}" class="text-sm text-slate-500 hover:text-slate-700">&larr; Petty cash funds</a>
  <h1 class="text-xl font-semibold text-slate-900 mt-1">New Petty Cash Fund</h1>
  <p class="text-sm text-slate-500 mt-1">Imprest fund with custodian, GL account, and 85% replenishment trigger (ADR-027).</p>

  <form method="post" class="mt-6 bg-white rounded-xl border border-slate-200 p-6 space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_fund_code">Fund</label>
        <select name="fund_code" id="id_fund_code" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          <option value="general">PCF-General (Leaslyn)</option>
          <option value="maintenance">PCF-Maintenance (Treasury)</option>
          <option value="technical">PCF-Technical (Alywin)</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_name">Name</label>
        <input type="text" name="name" id="id_name" required maxlength="128"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_custodian">Custodian</label>
        <select name="custodian" id="id_custodian" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          {% for u in custodians %}<option value="{{ u.id }}">{{ u.get_full_name|default:u.username }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_segment">Segment</label>
        <select name="segment" id="id_segment" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          {% for seg in segments %}<option value="{{ seg.id }}">{{ seg.code }} — {{ seg.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_gl_account">GL account (unclaimed)</label>
        <select name="gl_account" id="id_gl_account" data-searchable required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          {% for acc in accounts %}<option value="{{ acc.id }}">{{ acc.code }} {{ acc.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_imprest_amount">Imprest amount (₱)</label>
        <input type="number" step="0.01" min="0.01" name="imprest_amount" id="id_imprest_amount" value="20000.00"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-right tabular-nums">
      </div>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
        Create fund
      </button>
    </div>
  </form>
</div>
{% endblock %}
