{% extends "ui/base.html" %}
{% block title %}Generate Cash Cycles — STMIET Accounting{% endblock %}
{% block content %}
<div class="p-6 max-w-3xl">
  <a href="{% url 'ui:cycle_list' %}" class="text-sm text-slate-500 hover:text-slate-700">&larr; Weekly cycles</a>
  <h1 class="text-xl font-semibold text-slate-900 mt-1">Generate Weekly Cash Cycles</h1>
  <p class="text-sm text-slate-500 mt-1">Tue–Mon cycles with opening/closing balances (ADR-013, ADR-028). Idempotent for existing weeks.</p>

  <form method="post" class="mt-6 bg-white rounded-xl border border-slate-200 p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="id_segment">Segment</label>
      <select name="segment" id="id_segment" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
        {% for seg in segments %}<option value="{{ seg.id }}">{{ seg.code }} — {{ seg.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_start_date">From (Tue)</label>
        <input type="date" name="start_date" id="id_start_date" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_end_date">To</label>
        <input type="date" name="end_date" id="id_end_date" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
        Generate cycles
      </button>
    </div>
  </form>
</div>
{% endblock %}
