{% extends "ui/base.html" %}
{% block title %}New Bank Account — STMIET Accounting{% endblock %}
{% block content %}
<div class="p-6">
  <a href="{% url 'ui:bank_list' %}" class="text-sm text-slate-500 hover:text-slate-700">&larr; Bank accounts</a>
  <h1 class="text-xl font-semibold text-slate-900 mt-1">New Bank Account</h1>
  <p class="text-sm text-slate-500 mt-1">Bank master with GL mapping and ADB requirement (ADR-010/016).</p>

  <form method="post" class="mt-6 bg-white rounded-xl border border-slate-200 p-6 space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_code">Code</label>
        <input type="text" name="code" id="id_code" required maxlength="16" placeholder="PNB-DHPP"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_name">Account name</label>
        <input type="text" name="name" id="id_name" required maxlength="255"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_account_type">Type</label>
        <select name="account_type" id="id_account_type" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          <option value="savings">Savings</option>
          <option value="checking">Checking</option>
          <option value="pcf_coh">Petty Cash &amp; Cash on Hand</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_bank_name">Bank name</label>
        <input type="text" name="bank_name" id="id_bank_name" maxlength="128"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_bank_code">Bank code</label>
        <input type="text" name="bank_code" id="id_bank_code" maxlength="16" placeholder="PNB, BDO, 1VB"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_gl_account">GL account</label>
        <select name="gl_account" id="id_gl_account" data-searchable required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          {% for acc in accounts %}<option value="{{ acc.id }}">{{ acc.code }} {{ acc.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_segment">Segment</label>
        <select name="segment" id="id_segment" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          {% for seg in segments %}<option value="{{ seg.id }}">{{ seg.code }} — {{ seg.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_adb_required">ADB required (₱)</label>
        <input type="number" step="0.01" min="0" name="adb_required" id="id_adb_required" value="5000.00"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-right tabular-nums">
      </div>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
        Create bank account
      </button>
    </div>
  </form>
</div>
{% endblock %}
