{% extends "ui/base.html" %}
{% block title %}New Fixed Asset — STMIET Accounting{% endblock %}
{% block content %}
<div class="p-6">
  <a href="{% url 'ui:asset_list' %}" class="text-sm text-slate-500 hover:text-slate-700">&larr; Assets</a>
  <h1 class="text-xl font-semibold text-slate-900 mt-1">New Fixed Asset</h1>
  <p class="text-sm text-slate-500 mt-1">Acquisition posts the 9.1 JE (Dr Asset | Cr funding source) immediately. FA-YYYY-#### auto-assigned (ADR-034).</p>

  <form method="post" class="mt-6 bg-white rounded-xl border border-slate-200 p-6 space-y-4">
    {% csrf_token %}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_name">Name</label>
        <input type="text" name="name" id="id_name" required maxlength="255"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_category">Category</label>
        <select name="category" id="id_category" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          {% for cat in categories %}<option value="{{ cat.id }}">{{ cat.code }} — {{ cat.name }} ({{ cat.useful_life_years }} yrs)</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_segment">Segment</label>
        <select name="segment" id="id_segment" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          {% for seg in segments %}<option value="{{ seg.id }}">{{ seg.code }} — {{ seg.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_acquisition_date">Acquisition date</label>
        <input type="date" name="acquisition_date" id="id_acquisition_date" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_cost">Cost (₱)</label>
        <input type="number" step="0.01" min="0.01" name="cost" id="id_cost" required
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-right tabular-nums">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_residual_value">Residual value (₱)</label>
        <input type="number" step="0.01" min="0" name="residual_value" id="id_residual_value" value="0.00"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-right tabular-nums">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_acquisition_fees">Acquisition fees (₱)</label>
        <input type="number" step="0.01" min="0" name="acquisition_fees" id="id_acquisition_fees" value="0.00"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm text-right tabular-nums">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_funding_source">Funding source</label>
        <select name="funding_source" id="id_funding_source" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
          <option value="cash">Cash</option>
          <option value="ap">Accounts Payable</option>
          <option value="loan">Loan</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1" for="id_financed_loan_reference">Loan reference (if financed)</label>
        <input type="text" name="financed_loan_reference" id="id_financed_loan_reference"
               class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm">
      </div>
    </div>
    <div class="flex justify-end">
      <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
        Acquire asset
      </button>
    </div>
  </form>
</div>
{% endblock %}
