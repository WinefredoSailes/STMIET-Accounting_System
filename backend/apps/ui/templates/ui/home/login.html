{% extends "ui/base.html" %}
{% load static %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="flex flex-col items-center mb-6">
        <img src="{% static 'img/logo.svg' %}" alt="logo" class="h-14 w-14 rounded-2xl shadow-md">
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-surface-200 p-8">
        <h1 class="text-lg font-semibold text-surface-900">Accounting System</h1>
      <p class="text-sm text-surface-500 mt-1 mb-6">Sign in to continue</p>
      {% if form.non_field_errors %}
      <div class="mb-4 rounded-md bg-rose-50 text-rose-800 border border-rose-200 px-4 py-3 text-sm">
        {{ form.non_field_errors.0 }}
      </div>
      {% endif %}
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-surface-700 mb-1" for="id_username">Username</label>
          <input type="text" name="username" id="id_username" autofocus required
                 class="w-full rounded-md border border-surface-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-surface-700 mb-1" for="id_password">Password</label>
          <input type="password" name="password" id="id_password" required
                 class="w-full rounded-md border border-surface-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500">
        </div>
        <button type="submit"
                class="w-full rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700">
          Sign in
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
