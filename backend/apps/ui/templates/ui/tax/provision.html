{% extends "ui/base.html" %}
{% block title %}Income Tax Provision — STMIET Accounting{% endblock %}
{% block content %}
<div class="p-4 sm:p-6">
  <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <h1 class="text-xl font-semibold text-slate-900">INCOME TAX PROVISION</h1>
      <p class="text-sm text-slate-500 mt-1">Dr 64600 (tax expense) | Cr income tax payable (segment account), posted through the standard engine.</p>
    </div>
    <a href="{% url 'ui:tax_dashboard' %}" class="text-sm font-medium text-indigo-600 hover:text-indigo-800">← Tax Dashboard</a>
  </div>

  <form method="post" class="mt-6 max-w-lg rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
    {% csrf_token %}
    <div class="space-y-3">
      <div>
        <label class="text-xs uppercase tracking-wider text-slate-500">Segment</label>
        <select name="segment" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
          <option value="">Select segment…</option>
          {% for s in segments %}
          <option value="{{ s.id }}">{{ s.code }} — {{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-xs uppercase tracking-wider text-slate-500">Filing period</label>
        <input type="text" name="filing_period" required placeholder="Q1 2026" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
      <div>
        <label class="text-xs uppercase tracking-wider text-slate-500">Taxable income (₱)</label>
        <input type="number" name="taxable_income" step="0.01" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
      <div>
        <label class="text-xs uppercase tracking-wider text-slate-500">Rate (optional, blank = 20%)</label>
        <input type="number" name="rate" step="0.0001" placeholder="0.20" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none">
      </div>
    </div>
    <button type="submit" class="mt-4 w-full rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40">Post provision</button>
  </form>
</div>
{% endblock %}
