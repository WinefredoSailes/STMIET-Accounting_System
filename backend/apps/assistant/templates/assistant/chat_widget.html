{% load static %}
<div id="chat-widget" class="fixed bottom-20 right-4 z-50 sm:right-6">
  <button id="chat-toggle" onclick="toggleChat()" aria-label="Open assistant" title="Smart Search Assistant"
    class="h-12 w-12 flex items-center justify-center rounded-full border border-surface-200 bg-white text-surface-600 shadow-lg hover:border-brand-300 hover:text-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
    <svg class="h-6 w-6" aria-hidden="true"><use href="#i-chat"/></svg>
  </button>

  <div id="chat-panel" class="hidden fixed bottom-36 right-4 sm:right-6 w-[calc(100vw-2rem)] max-w-md h-[500px] bg-white border border-surface-200 rounded-xl shadow-2xl flex flex-col overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-surface-200 bg-brand-50">
      <div class="flex items-center gap-2">
        <svg class="h-5 w-5 text-brand-600" aria-hidden="true"><use href="#i-chat"/></svg>
        <span class="font-semibold text-surface-900 text-sm">Smart Search Assistant</span>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="clearChat()" aria-label="Clear conversation" title="Clear conversation"
          class="rounded-md px-1.5 py-0.5 text-surface-400 hover:text-surface-900 hover:bg-surface-100 text-sm leading-none">
          <svg class="h-4 w-4" aria-hidden="true"><use href="#i-archive-box"/></svg>
        </button>
        <button onclick="toggleChat()" aria-label="Close assistant" title="Close"
          class="rounded-md px-1.5 py-0.5 text-surface-400 hover:text-surface-900 hover:bg-surface-100 text-lg leading-none">×</button>
      </div>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
      <div class="flex gap-2">
        <div class="flex-shrink-0 h-7 w-7 rounded-full bg-brand-100 flex items-center justify-center">
          <svg class="h-4 w-4 text-brand-600" aria-hidden="true"><use href="#i-chat"/></svg>
        </div>
        <div class="bg-surface-100 rounded-lg px-3 py-2 text-sm text-surface-700 max-w-[80%]">
          How can I help? Type a question or pick a suggestion below.
        </div>
      </div>
    </div>

    <div id="chat-typing" class="hidden px-4 pb-2">
      <div class="flex gap-2">
        <div class="flex-shrink-0 h-7 w-7 rounded-full bg-brand-100 flex items-center justify-center">
          <svg class="h-4 w-4 text-brand-600" aria-hidden="true"><use href="#i-chat"/></svg>
        </div>
        <div class="bg-surface-100 rounded-lg px-3 py-2 text-sm text-surface-500">
          <span class="inline-flex gap-1">
            <span class="w-1.5 h-1.5 bg-surface-400 rounded-full animate-bounce"></span>
            <span class="w-1.5 h-1.5 bg-surface-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></span>
            <span class="w-1.5 h-1.5 bg-surface-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></span>
          </span>
        </div>
      </div>
    </div>

    <div id="chat-suggestions" class="px-4 pb-2 flex flex-wrap gap-1.5">
      <button onclick="sendSuggestion('Top 5 suppliers by amount')" class="text-xs px-2.5 py-1 rounded-full border border-surface-200 bg-white text-surface-600 hover:border-brand-300 hover:text-brand-600">Top 5 suppliers</button>
      <button onclick="sendSuggestion('What are the pending CVs?')" class="text-xs px-2.5 py-1 rounded-full border border-surface-200 bg-white text-surface-600 hover:border-brand-300 hover:text-brand-600">Pending CVs</button>
      <button onclick="sendSuggestion('Bank balance summary')" class="text-xs px-2.5 py-1 rounded-full border border-surface-200 bg-white text-surface-600 hover:border-brand-300 hover:text-brand-600">Bank balance</button>
      <button onclick="sendSuggestion('Unpaid invoices')" class="text-xs px-2.5 py-1 rounded-full border border-surface-200 bg-white text-surface-600 hover:border-brand-300 hover:text-brand-600">Unpaid invoices</button>
    </div>

    <form id="chat-form" class="px-4 pb-4 flex gap-2">
      <input type="text" id="chat-input" placeholder="Type your question..."
        class="flex-1 rounded-lg border border-surface-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400">
      <button type="submit" aria-label="Send" title="Send"
        class="rounded-lg bg-brand-600 px-3 py-2 text-white hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
        <svg class="h-4 w-4" aria-hidden="true"><use href="#i-send"/></svg>
      </button>
    </form>
  </div>
</div>

<script src="{% static 'js/chat-widget.js' %}"></script>
