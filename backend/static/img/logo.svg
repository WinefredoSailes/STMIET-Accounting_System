<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Accounting System logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#shine)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#0f766e" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- bar chart -->
  <g fill="url(#bars)">
    <rect x="11" y="35" width="9" height="16" rx="2.5"/>
    <rect x="26" y="26" width="9" height="25" rx="2.5"/>
    <rect x="41" y="16" width="9" height="35" rx="2.5"/>
  </g>

  <!-- baseline -->
  <line x1="10" y1="51" x2="52" y2="51" stroke="#f0fdfa" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>

  <!-- amber growth arrow -->
  <path d="M16.5 29.5l6.5-6.5 4.5 4.5 10.5-11" fill="none" stroke="#fbbf24" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32.5 16.5H38l0 5.5" fill="none" stroke="#fbbf24" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>