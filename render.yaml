# Render Blueprint — STMIET Accounting System
# Single source of truth for the Render deployment (see adr/ADR-040-deployment-render.md).
# Apply via: Render Dashboard → New Blueprint (uses this file at repo root).

services:
  # ── Django web service (built from Dockerfile) ─────────────────────────
  - type: web
    runtime: docker
    name: stmiet-accounting
    plan: free
    rootDir: backend                 # Docker build context = backend/ (Dockerfile lives here)
    dockerfilePath: ./Dockerfile
    dockerCommand: sh ./entrypoint.sh
    healthCheckPath: /health/      # blue-green waits for a real 200 before
                                   # tearing down the old instance (no more
                                   # deploy-time Bad Gateway)
    envVars:
      - key: SECRET_KEY
        sync: false                  # Fill in the Render Dashboard during first deploy
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: ALLOWED_HOSTS           # Required; Django rejects every request if empty
        value: .onrender.com
      - key: DATABASE_URL            # Auto-wired from the PostgreSQL database below
        fromDatabase:
          name: stmiet-accounting-db
          property: connectionString
      # Uploaded media (profile avatars) on the persistent disk. The disk is
      # attached in the Dashboard (Mount Path /var/data); Django's FileSystem-
      # Storage then writes /var/data/media/avatars/ so uploads survive
      # redeploys. Declared here so a blueprint sync cannot drop it.
      # (disks: in this file are intentionally not declared: the disk already
      # exists on the service, and re-declaring can make Render recreate it.)
      - key: MEDIA_ROOT
        value: /var/data/media

# ── PostgreSQL (managed by Render) ──────────────────────────────────────
databases:
  - name: stmiet-accounting-db
    postgresMajorVersion: '18'
    plan: free
    databaseName: stmiet_accounting
    ipAllowList: []                  # Private network only; web service accesses via internal URL

