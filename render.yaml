# Render Blueprint — STMIET Accounting System
# Single source of truth for the Render deployment (see adr/ADR-040-deployment-render.md).
# Apply via: Render Dashboard → New Blueprint (uses this file at repo root).

services:
  # ── Django web service (built from Dockerfile) ─────────────────────────
  - type: web
    runtime: docker
    name: stmiet-accounting
    plan: free
    rootDir: backend                 # Docker build context = backend/ (Dockerfile lives here)
    dockerfilePath: ./Dockerfile
    dockerCommand: >
      python manage.py migrate --run-sync &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
    envVars:
      - key: SECRET_KEY
        sync: false                  # Fill in the Render Dashboard during first deploy
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: ALLOWED_HOSTS           # Required; Django rejects every request if empty
        value: .onrender.com
      - key: DATABASE_URL            # Auto-wired from the PostgreSQL database below
        fromDatabase:
          name: stmiet-db
          property: connectionString

# ── PostgreSQL (managed by Render) ──────────────────────────────────────
databases:
  - name: stmiet-db
    postgresMajorVersion: '18'
    plan: free
    databaseName: stmiet_accounting
    ipAllowList: []                  # Private network only; web service accesses via internal URL

